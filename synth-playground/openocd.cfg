# OpenOCD configuration for STM32H533
# Uses STM32H7 config as base since H5 and H7 use same flash controller

source [find interface/stlink.cfg]
source [find target/stm32h7x.cfg]

# Speed and reset configuration
adapter speed 4000
reset_config srst_only connect_assert_srst

# Workarounds for H5 secure features when using H7 config
gdb memory_map disable
gdb breakpoint_override hard
